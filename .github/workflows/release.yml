name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-13
            platform: macos-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller aioncode.spec

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            mv dist/aioncode.exe dist/aioncode-${{ matrix.platform }}.exe
          else
            mv dist/aioncode dist/aioncode-${{ matrix.platform }}
          fi

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            dist/aioncode-${{ matrix.platform }}.exe version
          else
            chmod +x dist/aioncode-${{ matrix.platform }}
            dist/aioncode-${{ matrix.platform }} version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioncode-${{ matrix.platform }}
          path: dist/aioncode-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
