<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AionCode — 副驾驶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/views.css">
</head>
<body>

<!-- Icon Rail -->
<nav class="rail">
  <!-- Core views -->
  <button class="rail-btn active" data-view="overview" onclick="switchView('overview')" aria-label="概览">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
    <span class="tip">概览</span>
  </button>
  <button class="rail-btn" data-view="files" onclick="switchView('files')" aria-label="文件">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 2A1.5 1.5 0 013 .5h4.379a1.5 1.5 0 011.06.44l3.122 3.12A1.5 1.5 0 0112 5.122V13.5A1.5 1.5 0 0110.5 15h-7A1.5 1.5 0 012 13.5V3.5H1.5zM3 2v11.5a.5.5 0 00.5.5h7a.5.5 0 00.5-.5V5.621L7.879 2.5H3.5A.5.5 0 003 2z"/></svg>
    <span class="tip">文件</span>
  </button>
  <button class="rail-btn" data-view="monitor" onclick="switchView('monitor')" aria-label="监控">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a.5.5 0 01.5.5v5.793l3.354 3.354a.5.5 0 01-.708.708l-3.5-3.5A.5.5 0 017.5 7.5v-6A.5.5 0 018 1z"/><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM1 8a7 7 0 1114 0A7 7 0 011 8z"/></svg>
    <span class="tip">监控</span>
  </button>
  <!-- Data views -->
  <div class="rail-divider"></div>
  <button class="rail-btn" data-view="specs" onclick="switchView('specs')" aria-label="需求">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 0a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V2a2 2 0 00-2-2H4zm1 3h6v1H5V3zm0 3h6v1H5V6zm0 3h4v1H5V9z"/></svg>
    <span class="tip">需求</span>
  </button>
  <button class="rail-btn" data-view="plans" onclick="switchView('plans')" aria-label="方案">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v2H2V2zm0 4h8v2H2V6zm0 4h10v2H2v-2zm0 4h6v2H2v-2z"/></svg>
    <span class="tip">方案</span>
  </button>
  <button class="rail-btn" data-view="rules" onclick="switchView('rules')" aria-label="规则">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0L2 3v5c0 4.17 2.56 7.27 6 8 3.44-.73 6-3.83 6-8V3L8 0zm0 2.18l4 1.78v4.04c0 3.04-1.77 5.44-4 6.12C5.77 13.44 4 11.04 4 8V3.96l4-1.78z"/></svg>
    <span class="tip">规则</span>
  </button>
  <button class="rail-btn" data-view="checklists" onclick="switchView('checklists')" aria-label="清单">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h2v2H3V3zm4 0h6v1H7V3zM3 7h2v2H3V7zm4 0h6v1H7V7zM3 11h2v2H3v-2zm4 0h6v1H7v-2z"/></svg>
    <span class="tip">清单</span>
  </button>
  <button class="rail-btn" data-view="bugs" onclick="switchView('bugs')" aria-label="缺陷">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="3"/><path d="M2.5 8H0M16 8h-2.5M8 2.5V0M8 16v-2.5M3.17 3.17L1.4 1.4M14.6 14.6l-1.77-1.77M3.17 12.83L1.4 14.6M14.6 1.4l-1.77 1.77" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    <span class="tip">缺陷</span>
  </button>
  <button class="rail-btn" data-view="test" onclick="switchView('test')" aria-label="测试">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6 1v5H2l6 9V9h4L6 1zm1 2.5L10.25 9H7v4.5L3.75 8H7V3.5z"/></svg>
    <span class="tip">测试</span>
  </button>
  <button class="rail-btn" data-view="changelog" onclick="switchView('changelog')" aria-label="日志">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zM0 8a8 8 0 1116 0A8 8 0 010 8zm8-4.5v5l3.5 2-.5.87L7 9.13V3.5h1z"/></svg>
    <span class="tip">日志</span>
  </button>
  <button class="rail-btn" data-view="brainstorm" onclick="switchView('brainstorm')" aria-label="协作">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1C4.13 1 1 3.58 1 6.75c0 1.83 1.08 3.45 2.75 4.5L3 14.5l3.5-2.1c.49.07.99.1 1.5.1 3.87 0 7-2.58 7-5.75S11.87 1 8 1z"/></svg>
    <span class="tip">协作</span><span class="badge" id="b-brainstorm" style="display:none"></span>
  </button>
  <!-- Bottom -->
  <div class="rail-sep"></div>
  <button class="rail-btn" data-view="skills" onclick="switchView('skills')" aria-label="技能">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 0h-11A2.5 2.5 0 000 2.5v6A2.5 2.5 0 002.5 11H5v3.5a1.5 1.5 0 002.56 1.06L11.12 12H13.5A2.5 2.5 0 0016 9.5v-7A2.5 2.5 0 0013.5 0zM5 5.5a1 1 0 11-2 0 1 1 0 012 0zm4 0a1 1 0 11-2 0 1 1 0 012 0zm4 0a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
    <span class="tip">技能</span>
  </button>
  <button class="rail-btn" data-view="team" onclick="switchView('team')" aria-label="团队">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6 8a3 3 0 100-6 3 3 0 000 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H1zm9-1.5a.5.5 0 01.5-.5H12V10a.5.5 0 011 0v2h1.5a.5.5 0 010 1H13v2a.5.5 0 01-1 0v-2h-1.5a.5.5 0 01-.5-.5z"/></svg>
    <span class="tip">团队</span>
  </button>
  <button class="rail-btn" data-view="help" onclick="switchView('help')" aria-label="帮助">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286zm1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94z"/></svg>
    <span class="tip">帮助</span>
  </button>
  <button class="rail-btn" data-view="about" onclick="switchView('about')" aria-label="关于">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>
    <span class="tip">关于</span>
  </button>
  <button class="rail-btn" data-view="settings" onclick="switchView('settings')" aria-label="设置">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M7.07 0l-.26 1.63a5.97 5.97 0 00-1.64.68L3.72 1.4 1.4 3.72l.91 1.45a5.97 5.97 0 00-.68 1.64L0 7.07v3.27l1.63.26c.15.58.38 1.13.68 1.64l-.91 1.45 2.32 2.32 1.45-.91c.51.3 1.06.53 1.64.68L7.07 16h3.27l.26-1.63a5.97 5.97 0 001.64-.68l1.45.91 2.32-2.32-.91-1.45c.3-.51.53-1.06.68-1.64L16 8.93V5.66l-1.63-.26a5.97 5.97 0 00-.68-1.64l.91-1.45L12.28 0l-1.45.91A5.97 5.97 0 009.19.23L8.93 0H7.07zM8 5a3 3 0 110 6 3 3 0 010-6z"/></svg>
    <span class="tip">设置</span>
  </button>
</nav>

<!-- Main -->
<div class="main">
  <div class="header">
    <select id="proj-sel" onchange="switchProject(this.value)"><option>加载中...</option></select>
    <span class="path" id="proj-path"></span>
    <span class="spacer"></span>
    <span class="brand">aioncode</span>
  </div>

  <div class="content">
    <!-- Sidebar: changes per view -->
    <div class="sidebar" id="sidebar">
      <!-- Overview sidebar -->
      <div class="view-sidebar" id="vs-overview">
        <div class="sw-title">项目概览</div>
        <div class="sw-stats" id="stats"></div>
        <div class="sw-title" style="margin-top:4px">最近活动</div>
        <div class="sw-body" id="changelog"></div>
      </div>
      <!-- Files sidebar -->
      <div class="view-sidebar hidden" id="vs-files">
        <div class="sw-title">资源管理器</div>
        <div class="sw-body" id="ftree"></div>
      </div>
      <!-- Monitor sidebar -->
      <div class="view-sidebar hidden" id="vs-monitor">
        <div class="sw-title"><span class="live-dot" id="live-dot" style="display:none"></span>实时事件 <span class="sw-badge" id="b-events">—</span></div>
        <div class="sw-body" id="events"></div>
      </div>
      <!-- Bugs sidebar -->
      <div class="view-sidebar hidden" id="vs-bugs">
        <div class="sw-title">缺陷列表 <span class="sw-badge" id="b-bugs">—</span></div>
        <div class="sw-body" id="bugs"></div>
      </div>
      <!-- Team sidebar -->
      <div class="view-sidebar hidden" id="vs-team">
        <div class="sw-title">团队成员</div>
        <div class="sw-body" id="team"></div>
      </div>
      <!-- Data view sidebars -->
      <div class="view-sidebar hidden" id="vs-specs">
        <div class="sw-title">需求文档 <span class="sw-badge" id="b-specs">—</span></div>
        <div class="sw-body" id="specs-list"></div>
      </div>
      <div class="view-sidebar hidden" id="vs-plans">
        <div class="sw-title">实施方案 <span class="sw-badge" id="b-plans">—</span></div>
        <div class="sw-body" id="plans-list"></div>
      </div>
      <div class="view-sidebar hidden" id="vs-rules">
        <div class="sw-title">项目规则 <span class="sw-badge" id="b-rules">—</span></div>
        <div class="sw-body" id="rules-list"></div>
      </div>
      <div class="view-sidebar hidden" id="vs-checklists">
        <div class="sw-title">工作清单 <span class="sw-badge" id="b-checklists">—</span></div>
        <div class="sw-body" id="checklists-list"></div>
      </div>
      <div class="view-sidebar hidden" id="vs-test">
        <div class="sw-title">测试报告 <span class="sw-badge" id="b-test">—</span></div>
        <div class="sw-body" id="test-list"></div>
      </div>
      <div class="view-sidebar hidden" id="vs-changelog">
        <div class="sw-title">变更日志 <span class="sw-badge" id="b-changelog">—</span></div>
        <div class="sw-body" id="changelog-list"></div>
      </div>
      <!-- Brainstorm sidebar -->
      <div class="view-sidebar hidden" id="vs-brainstorm">
        <div class="sw-title">设计协作</div>
        <div class="sw-body" id="brainstorm-sidebar">
          <p style="color:var(--text-tertiary);font-size:12px;padding:8px">方案选项将在右侧展示。在终端运行 aion-design 时自动激活。</p>
        </div>
      </div>
      <!-- Skills sidebar -->
      <div class="view-sidebar hidden" id="vs-skills">
        <div class="sw-title">技能管理 <span class="sw-badge" id="b-skills">--</span></div>
        <div class="skill-tabs" id="skill-tabs">
          <button class="skill-tab active" onclick="switchSkillTab('installed')">已安装</button>
          <button class="skill-tab" onclick="switchSkillTab('marketplace')">官方市场</button>
        </div>
        <div class="sw-body" id="skills-list"></div>
      </div>
      <!-- Settings sidebar -->
      <div class="view-sidebar hidden" id="vs-settings">
        <div class="sw-title">设置</div>
        <div class="sw-body" id="settings-list">
          <div class="settings-item">
            <div class="settings-row">
              <span class="settings-label">深色模式</span>
              <label class="toggle-switch" onclick="toggleThemeSwitch()">
                <input type="checkbox" id="theme-switch">
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-row" onclick="showModelConfig()" style="cursor:pointer">
              <span class="settings-label">模型配置</span>
              <span class="sw-badge" id="b-models">—</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Help sidebar (TOC) -->
      <div class="view-sidebar hidden" id="vs-help">
        <div class="sw-title">帮助中心</div>
        <div class="sw-body" id="help-toc"></div>
      </div>
      <!-- About sidebar (TOC) -->
      <div class="view-sidebar hidden" id="vs-about">
        <div class="sw-title">关于 AionCode</div>
        <div class="sw-body" id="about-toc"></div>
      </div>
    </div>

    <!-- Detail: changes per selection -->
    <div class="detail" id="detail"></div>
  </div>

  <div class="statusbar">
    <span class="status-dot" id="s-dot"></span>
    <span id="s-proj">—</span>
    <span class="sep">·</span>
    <span id="s-last">—</span>
    <span style="margin-left:auto" id="s-version">AionCode</span>
  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/views.js"></script>
<script src="/static/models.js"></script>
<script src="/static/brainstorm.js"></script>
</body>
</html>
