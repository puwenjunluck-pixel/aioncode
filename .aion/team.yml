# Risk keywords for auto-severity assessment during bug reporting
# Bugs matching 'critical' keywords are auto-escalated to severity: critical + risk_level: financial
# Bugs matching 'low' keywords are suggested as severity: low
risk_keywords:
  critical:
    - trade
    - order
    - payment
    - account
    - balance
    - refund
    - withdraw
    - transfer
    - transaction
    - billing
  low:
    - typo
    - ui
    - color
    - font
    - alignment
    - placeholder
    - tooltip
    - label
    - icon
