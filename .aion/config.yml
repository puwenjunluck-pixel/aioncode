# AionCode Project Configuration
# Docs: https://github.com/user/aioncode

version: "0.7.6"

rules:
  # Maximum rules per category before suggesting consolidation
  max_per_category: 30

workflow:
  # Recommended phase order (not enforced)
  phases:
    - think     # 讨论/碰撞/思考/目标对齐(融合挑战假设)
    - plan      # 实现规划(主路径由 aion-think Phase 10 自动建议,命令仅用于修改已有 plan)
    - impl
    - qa        # optional: browser-based QA
    - review    # verify + review + auto-learning 一站式
    - commit

profile:
  project_type: "fullstack"
  role: "fullstack"
  platform: "claude"

commands:
  installed:
    - aion-audit
    - aion-commit
    - aion-fix
    - aion-help
    - aion-loop
    - aion-plan
    - aion-qa
    - aion-review
    - aion-save
    - aion-scan
    - aion-think
