# AionCode Project Configuration
# Docs: https://github.com/user/aioncode

version: "0.7.0"

rules:
  # Maximum rules per category before suggesting consolidation
  max_per_category: 30

workflow:
  # Recommended phase order (not enforced)
  phases:
    - design    # 挑战假设 + 需求设计 + 方案对比 + (--demo 原型)
    - plan      # 规划 + 用户确认后直接执行
    - review    # verify + review + test gap 一站式
    - commit

profile:
  project_type: "fullstack"
  role: "fullstack"

commands:
  installed:
    - aion-commit
    - aion-design
    - aion-fix
    - aion-help
    - aion-learn
    - aion-loop
    - aion-plan
    - aion-qa
    - aion-review
    - aion-save
    - aion-scan
    - aion-status
