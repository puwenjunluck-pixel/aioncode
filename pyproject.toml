[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aioncode"
version = "0.7.5"
description = "AI-powered development intelligence framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "waynepo", email = "puwenjunluck@gmail.com"},
]
keywords = ["ai", "development", "cli", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13.0,<15",
    "packaging>=23.0,<25",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
]

[project.scripts]
aioncode = "aioncode.main:main"

[project.urls]
Homepage = "https://github.com/puwenjunluck-pixel/aioncode"
Repository = "https://github.com/puwenjunluck-pixel/aioncode"
Issues = "https://github.com/puwenjunluck-pixel/aioncode/issues"

[tool.setuptools.packages.find]
include = ["aioncode*"]

[tool.setuptools.package-data]
"aioncode.internal" = ["templates/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "ruff>=0.4,<1",
    "httpx>=0.25.0,<1",
]

# ── Ruff ──────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["aioncode/internal/dashboard/frontend/embedded.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress (not always clearer)
]

[tool.ruff.lint.isort]
known-first-party = ["aioncode"]

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
