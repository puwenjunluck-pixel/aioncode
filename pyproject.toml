[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aioncode"
version = "0.4.0"
description = "AI-powered development intelligence framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "waynepo", email = "puwenjunluck@gmail.com"},
]
keywords = ["ai", "development", "cli", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13.0",
    "requests>=2.28",
]

[project.scripts]
aioncode = "aioncode.main:main"

[project.urls]
Homepage = "https://github.com/puwenjunluck-pixel/aioncode"
Repository = "https://github.com/puwenjunluck-pixel/aioncode"
Issues = "https://github.com/puwenjunluck-pixel/aioncode/issues"

[tool.setuptools.packages.find]
include = ["aioncode*"]

[tool.setuptools.package-data]
"aioncode.internal" = ["templates/**/*"]
